name: NSE Paper Engine

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run outside the NSE market window
        required: false
        default: true
        type: boolean

      refresh_history:
        description: Refresh market history before this manual run
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "45 4 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "45 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-paper-engine
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      MARKET_PROVIDER: "yahoo"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent paper state
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/runtime
            backend/data/forward
            backend/*.db
            backend/data/*.db
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-state-${{ github.ref_name }}-

      # Daily EOD refresh.
      #
      # 09:45 UTC = 15:15 IST.
      # Manual runs only refresh when explicitly selected.
      - name: Refresh EOD market history
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '45 9 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.refresh_history) }}
        working-directory: backend
        run: |
          python scripts/cache_history.py \
            --period 2y \
            --chunk 50

      - name: Scheduled paper cycle
        working-directory: backend
        env:
          FORCE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          python scripts/run_scheduled_runtime.py

          echo
          echo "===== CLOUD RUNTIME STATUS ====="

          python scripts/runtime_status.py

      - name: Save persistent paper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backend/data/runtime
            backend/data/forward
            backend/*.db
            backend/data/*.db
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/data/runtime/
            backend/data/forward/
