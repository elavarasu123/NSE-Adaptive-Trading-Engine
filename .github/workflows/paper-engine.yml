name: NSE Paper Engine

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run outside the NSE market window
        required: false
        default: false
        type: boolean

      refresh_history:
        description: Refresh market history before this manual run
        required: false
        default: false
        type: boolean

  schedule:
    # 09:20–15:20 IST. Best-effort delivery, monitored by the watchdog.
    - cron: "50 3 * * 1-5"
    - cron: "50 4 * * 1-5"
    - cron: "50 5 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "50 7 * * 1-5"
    - cron: "50 8 * * 1-5"
    - cron: "50 9 * * 1-5"

    # 16:05 IST post-close:
    # refresh settled daily history and
    # create the final daily observation batch.
    - cron: "35 10 * * 1-5"

    # GitHub-only recovery deliveries. They skip without touching state when
    # the latest nominal slot already completed or the market window is closed.
    - cron: "57 3 * * 1-5"
    - cron: "7,27,47 4-10 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: nse-paper-engine
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      MARKET_PROVIDER: "yahoo"
      RUNTIME_SOURCE: "GITHUB_ACTIONS"
      SHARED_STATE_BACKEND: "db"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record scheduler receipt before installing dependencies
        id: receipt
        continue-on-error: true
        working-directory: backend
        run: python3 -m app.scheduler_health receipt --output "$RUNNER_TEMP/scheduler-receipt.json"

      - name: Preserve scheduler receipt
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scheduler-receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate shared database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing"
            exit 1
          fi

      - name: Select latest due paper slot
        id: due
        working-directory: backend
        run: python -m app.scheduled_recovery

      - name: Restore persistent paper state
        if: steps.due.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/runtime
            backend/data/forward
            backend/*.db
            backend/data/*.db
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-state-${{ github.ref_name }}-

      - name: Migrate legacy state to shared database
        if: steps.due.outputs.should_run == 'true'
        working-directory: backend
        run: |
          python scripts/migrate_legacy_to_shared_db.py
          python scripts/shared_db_status.py

      - name: Restore latest market history
        if: steps.due.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: backend/data/history
          key: market-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            market-history-${{ github.ref_name }}-

      - name: Ensure settled market history is current
        if: steps.due.outputs.should_run == 'true'
        id: history
        working-directory: backend
        env:
          REFRESH_HISTORY: ${{ (github.event_name == 'schedule' && github.event.schedule == '35 10 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.refresh_history) }}
        run: |
          if [ "$REFRESH_HISTORY" = "true" ]; then
            python scripts/ensure_market_history.py --force
          else
            python scripts/ensure_market_history.py
          fi

      # Market files are independent of the capital ledger. Preserve a validated
      # refresh even if an unrelated execution integrity check subsequently fails.
      - name: Save refreshed market history
        if: ${{ steps.history.outputs.refreshed == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: backend/data/history
          key: market-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Reliability preflight
        if: steps.due.outputs.should_run == 'true'
        working-directory: backend
        run: |
          python scripts/reliability_status.py

      - name: Scheduled paper cycle
        if: steps.due.outputs.should_run == 'true'
        working-directory: backend
        env:
          SCHEDULER_EVIDENCE_TOKEN: ${{ github.token }}
          FORCE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          python scripts/run_scheduled_runtime.py

          echo
          echo "===== CLOUD RUNTIME STATUS ====="

          python scripts/runtime_status.py

          echo
          echo "===== CLOUD RELIABILITY STATUS ====="

          python scripts/reliability_status.py

          echo
          echo "===== SHARED DATABASE STATUS ====="

          python scripts/shared_db_status.py

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/data/runtime/
            backend/data/forward/
