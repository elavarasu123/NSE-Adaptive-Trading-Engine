name: NSE Paper Engine

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market window"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "45 4 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "45 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-paper-engine
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: "1"
      MARKET_PROVIDER: "yahoo"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore paper state
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/runtime
            backend/*.db
            backend/data/*.db
            backend/data/backtests
            backend/data/cache
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-state-${{ github.ref_name }}-

      - name: Scheduled paper cycle
        working-directory: backend
        env:
          FORCE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          python scripts/run_scheduled_runtime.py
          python scripts/runtime_status.py

      - name: Save paper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            backend/data/runtime
            backend/*.db
            backend/data/*.db
            backend/data/backtests
            backend/data/cache
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/data/runtime/
            backend/data/backtests/
