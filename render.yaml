services:
  - type: web
    name: nse-adaptive-trading-engine
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /health

    envVars:
      - key: SHARED_STATE_BACKEND
        value: db

      - key: RUNTIME_SOURCE
        value: RENDER_DASHBOARD

      - key: PUBLIC_DASHBOARD_READ_ONLY
        value: "true"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: DATABASE_URL
        sync: false
