name: NSE Paper Engine

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run outside the NSE market window
        required: false
        default: true
        type: boolean

      refresh_history:
        description: Refresh market history before this manual run
        required: false
        default: false
        type: boolean

  schedule:
    # Intraday observation cycles.
    - cron: "45 3 * * 1-5"
    - cron: "45 4 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "45 9 * * 1-5"

    # 16:05 IST post-close:
    # refresh settled daily history and
    # create the final daily observation batch.
    - cron: "35 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: nse-paper-engine
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: "1"
      MARKET_PROVIDER: "yahoo"
      RUNTIME_SOURCE: "GITHUB_ACTIONS"
      SHARED_STATE_BACKEND: "db"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate shared database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing"
            exit 1
          fi

      - name: Restore persistent paper state
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/data/runtime
            backend/data/forward
            backend/*.db
            backend/data/*.db
          key: paper-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            paper-state-${{ github.ref_name }}-

      - name: Migrate legacy state to shared database
        working-directory: backend
        run: |
          python scripts/migrate_legacy_to_shared_db.py
          python scripts/shared_db_status.py

      - name: Restore latest market history
        uses: actions/cache/restore@v4
        with:
          path: backend/data/history
          key: market-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            market-history-${{ github.ref_name }}-

      - name: Refresh settled market history
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '35 10 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.refresh_history) }}
        working-directory: backend
        run: |
          python scripts/cache_history.py \
            --period 2y \
            --chunk 50

      - name: Reliability preflight
        working-directory: backend
        run: |
          python scripts/reliability_status.py

      - name: Scheduled paper cycle
        working-directory: backend
        env:
          FORCE_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: |
          python scripts/run_scheduled_runtime.py

          echo
          echo "===== CLOUD RUNTIME STATUS ====="

          python scripts/runtime_status.py

          echo
          echo "===== CLOUD RELIABILITY STATUS ====="

          python scripts/reliability_status.py

          echo
          echo "===== SHARED DATABASE STATUS ====="

          python scripts/shared_db_status.py

      - name: Save refreshed market history
        if: ${{ success() && ((github.event_name == 'schedule' && github.event.schedule == '35 10 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.refresh_history)) }}
        uses: actions/cache/save@v4
        with:
          path: backend/data/history
          key: market-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-runtime-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/data/runtime/
            backend/data/forward/
